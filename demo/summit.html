<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summit Fencing Co. demo</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --n0:#FFFFFF; --n25:#F9FBFA; --n50:#F1F5F3; --n100:#E6ECE9; --n200:#D5DDD9; --n300:#BAC5C0; --n500:#7B8782; --n600:#55625C; --n900:#131A17;
  --g25:#F3FAF6; --g50:#E7F4EC; --g100:#CFEADA; --g200:#A4D6B9; --g400:#48AE79; --g500:#1E8A55; --g600:#157246; --g700:#0E5734;
  --a25:#FFFBF1; --a50:#FFF4D9; --a100:#FEE8AE; --a300:#FACD5C; --a400:#F7B917; --a500:#E2A200; --a700:#8A6000; --a900:#382700;
  --r25:#FFF7F6; --r50:#FEEFED; --r100:#FBD8D3; --r500:#D53B2D; --r700:#9F2519;
  --b25:#F6F9FF; --b50:#ECF2FE; --b100:#D9E5FD; --b500:#3470E4; --b700:#2150B5;
  --v25:#F8F6FF; --v50:#F0ECFE; --v100:#DFD7FC; --v500:#6B54D6;
  --on-g:#FFFFFF; --bg:var(--n50); --surface:var(--n0); --ink:var(--n900); --muted:var(--n600); --faint:var(--n500); --line:var(--n100); --line-2:var(--n200);
  --mesh:rgba(30,138,85,.72); --post:#6B7772;
  --sh-1:0 1px 2px rgba(19,26,23,.05), 0 1px 4px rgba(19,26,23,.04);
  --sh-2:0 14px 30px -12px rgba(19,26,23,.18), 0 3px 8px rgba(19,26,23,.05);
  --sh-3:0 40px 70px -24px rgba(19,26,23,.38), 0 10px 24px -10px rgba(19,26,23,.18);
  --f:"Figtree","Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --n0:#161D1A; --n25:#1A221F; --n50:#0E1311; --n100:#232C28; --n200:#303A35; --n300:#46514C; --n500:#7F8B86; --n600:#A8B3AE; --n900:#EEF2F0;
    --g25:#132019; --g50:#16291F; --g100:#1C3B2B; --g200:#26543B; --g400:#48B57C; --g500:#52C488; --g600:#72D49F; --g700:#A1E4BE;
    --a25:#1D1A10; --a50:#2A2211; --a100:#3D3113; --a300:#8A6A16; --a700:#F4C75A;
    --r25:#221514; --r50:#2C1715; --r100:#3F1E1A; --r500:#F06B5D; --r700:#F59C92;
    --b25:#121A2A; --b50:#152036; --b100:#1C2C4A; --b500:#80A7F3; --b700:#AAC4F8; --v25:#1A1729; --v50:#211C38; --v100:#2E2752; --v500:#A996F6;
    --mesh:rgba(82,196,136,.7); --post:#A8B3AE; --on-g:#0A1A11;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 14px 30px -12px rgba(0,0,0,.6); --sh-3:0 40px 70px -24px rgba(0,0,0,.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --n0:#161D1A; --n25:#1A221F; --n50:#0E1311; --n100:#232C28; --n200:#303A35; --n300:#46514C; --n500:#7F8B86; --n600:#A8B3AE; --n900:#EEF2F0;
  --g25:#132019; --g50:#16291F; --g100:#1C3B2B; --g200:#26543B; --g400:#48B57C; --g500:#52C488; --g600:#72D49F; --g700:#A1E4BE;
  --a25:#1D1A10; --a50:#2A2211; --a100:#3D3113; --a300:#8A6A16; --a700:#F4C75A;
  --r25:#221514; --r50:#2C1715; --r100:#3F1E1A; --r500:#F06B5D; --r700:#F59C92;
  --b25:#121A2A; --b50:#152036; --b100:#1C2C4A; --b500:#80A7F3; --b700:#AAC4F8; --v25:#1A1729; --v50:#211C38; --v100:#2E2752; --v500:#A996F6;
  --mesh:rgba(82,196,136,.7); --post:#A8B3AE; --on-g:#0A1A11;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 14px 30px -12px rgba(0,0,0,.6); --sh-3:0 40px 70px -24px rgba(0,0,0,.75); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%; margin:0; font-family:var(--f); font-size:15px; line-height:1.45; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--b500); outline-offset:2px; border-radius:10px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:700; letter-spacing:-.02em}
svg{flex-shrink:0}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ---------- Encabezado ---------- */
.shell{display:flex; flex-direction:column; height:100%}
.top{flex:none; position:relative; z-index:30; display:flex; align-items:center; gap:18px; height:66px; padding:0 20px; background:var(--surface); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:11px; flex:none}
.mark{width:36px; height:36px; border-radius:12px; background:linear-gradient(145deg, var(--g500), var(--g600)); color:var(--on-g); display:grid; place-items:center; box-shadow:0 6px 14px -6px rgba(30,138,85,.6)}
.brand b{font-size:16px; font-weight:700; outline:none; border-radius:7px; padding:1px 5px; margin-left:-5px; white-space:nowrap; transition:background .15s}
.brand b[contenteditable="true"]{background:var(--n50); box-shadow:0 0 0 2px var(--b500)}
.brand small{display:block; color:var(--muted); font-size:12.5px}
.brand b{cursor:default}

.tg{--t25:var(--g25); --t50:var(--g50); --t100:var(--g100); --t200:var(--g200); --t600:var(--g600)}
.ta{--t25:var(--a25); --t50:var(--a50); --t100:var(--a100); --t200:var(--a300); --t600:var(--a700)}
.tb{--t25:var(--b25); --t50:var(--b50); --t100:var(--b100); --t200:var(--b100); --t600:var(--b500)}
.tv{--t25:var(--v25); --t50:var(--v50); --t100:var(--v100); --t200:var(--v100); --t600:var(--v500)}
.tred{--t25:var(--r25); --t50:var(--r50); --t100:var(--r100); --t200:var(--r100); --t600:var(--r500)}

/* ---------- Celular ---------- */
.phone{width:410px; height:clamp(640px, calc(100vh - 120px), 800px); border-radius:52px; padding:11px; background:#131A17; box-shadow:var(--sh-3); position:relative}
:root[data-theme="dark"] .phone{background:#2B3531}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .phone{background:#2B3531} }
.screen{height:100%; border-radius:42px; overflow:hidden; background:linear-gradient(180deg, var(--g25), var(--bg) 40%); display:flex; flex-direction:column; position:relative}
.notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:100px; height:28px; border-radius:16px; background:#131A17; z-index:6}
.sbar{flex:none; height:40px; display:flex; align-items:center; justify-content:space-between; padding:8px 30px 0; font-size:14px; font-weight:700}
.p-body{flex:1; overflow-y:auto; padding:10px 22px 24px; scrollbar-width:none; position:relative}
.p-body::-webkit-scrollbar{display:none}
.hello small{display:block; font-size:16px; color:var(--muted); font-weight:500}
.hello b{display:block; font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.1; margin-top:2px}
.where{display:flex; align-items:center; gap:10px; width:100%; margin-top:18px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line); text-align:left; transition:border-color .2s, box-shadow .2s, background .2s}
.where:hover{border-color:var(--g200); background:var(--g25); box-shadow:var(--sh-1)}
.where .pin{width:38px; height:38px; border-radius:12px; background:var(--g50); color:var(--g600); display:grid; place-items:center}
.where small{display:block; font-size:12.5px; color:var(--muted)}
.where b{display:block; font-size:16px; font-weight:700}
.where .ch{margin-left:auto; font-size:13.5px; color:var(--g600); font-weight:600}
.acts{display:grid; gap:16px; margin-top:30px}
.act{display:flex; align-items:center; gap:16px; width:100%; min-height:90px; text-align:left; padding:18px 18px; border-radius:26px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1); transition:transform .25s var(--ease), box-shadow .25s, background .25s, border-color .25s}
.act:hover{transform:translateY(-3px); box-shadow:var(--sh-2); background:var(--t25); border-color:var(--t100)}
.act:active{transform:scale(.985)}
.act .ai{width:54px; height:54px; border-radius:18px; display:grid; place-items:center; background:var(--t50); color:var(--t600); flex:none; transition:transform .3s var(--ease), background .25s}
.act:hover .ai{transform:scale(1.07) rotate(-5deg); background:var(--t100)}
.act b{display:block; font-size:20px; font-weight:700; letter-spacing:-.02em}
.act small{display:block; font-size:14.5px; color:var(--muted); margin-top:2px}
.act .chev{margin-left:auto; color:var(--faint); transition:transform .25s var(--ease), color .2s}
.act:hover .chev{transform:translateX(4px); color:var(--t600)}
.act.hero-a{background:linear-gradient(140deg, var(--a300), var(--a400)); border-color:transparent; color:var(--a900); box-shadow:0 16px 30px -16px rgba(226,162,0,.8)}
.act.hero-a .ai{background:rgba(255,255,255,.5); color:var(--a900)}
.act.hero-a small{color:rgba(56,39,0,.75)}
.act.hero-a .chev{color:rgba(56,39,0,.55)}
.act.hero-a:hover{background:linear-gradient(140deg, var(--a400), var(--a500)); box-shadow:0 20px 36px -16px rgba(226,162,0,.9)}
.act.hero-a:hover .ai{background:rgba(255,255,255,.65)}
.act.hero-a:hover .chev{color:var(--a900)}
.last{margin-top:26px}
.last-h{font-size:14px; font-weight:600; color:var(--muted); margin:0 4px 10px; display:flex; justify-content:space-between}
.last-h button{color:var(--g600); font-weight:600; font-size:14px; border-radius:8px; padding:0 4px; transition:color .15s}
.last-h button:hover{color:var(--g700); text-decoration:underline}
.tabs{flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:10px 22px 22px; background:color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--line)}
.tab{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; border-radius:16px; font-size:13px; font-weight:600; color:var(--faint); transition:background .2s, color .2s}
.tab:hover{color:var(--ink); background:var(--n50)}
.tab[aria-current="true"]{color:var(--g600); background:var(--g50)}
.tab .bd{position:absolute; top:2px; left:calc(50% + 6px); min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--r500); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2.5px var(--surface)}
.tab .bd.pop{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.4)}}

/* Pasos de los formularios */
.fhead{flex:none; display:flex; align-items:center; gap:12px; padding:6px 20px 4px}
.fhead .back{width:44px; height:44px; border-radius:15px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); transition:background .15s, border-color .15s}
.fhead .back:hover{background:var(--g25); border-color:var(--g200)}
.fhead .t{font-size:15px; font-weight:600; color:var(--muted)}
.dots{margin-left:auto; display:flex; gap:5px}
.dots i{width:22px; height:6px; border-radius:3px; background:var(--n100); transition:background .3s, width .3s}
.dots i.on{background:var(--a400); width:30px}
.q{font-size:27px; font-weight:800; letter-spacing:-.03em; line-height:1.15; margin:18px 2px 6px}
.qs{font-size:15.5px; color:var(--muted); margin:0 2px 22px}
.opts{display:grid; gap:12px}
.opt{display:flex; align-items:center; gap:14px; width:100%; min-height:72px; padding:14px 18px; border-radius:22px; background:var(--surface); border:1.5px solid var(--line); text-align:left; font-size:18px; font-weight:600; transition:transform .2s var(--ease), border-color .2s, background .2s, box-shadow .2s}
.opt:hover{border-color:var(--t200, var(--g200)); background:var(--t25, var(--g25)); transform:translateY(-2px); box-shadow:var(--sh-1)}
.opt .oi{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; background:var(--t50, var(--g50)); color:var(--t600, var(--g600)); flex:none}
.opt .ck{margin-left:auto; width:26px; height:26px; border-radius:50%; border:2px solid var(--line-2); display:grid; place-items:center; color:transparent; transition:.2s}
.opt[aria-pressed="true"]{border-color:var(--t600, var(--g500)); background:var(--t25, var(--g25))}
.opt[aria-pressed="true"] .ck{background:var(--t600, var(--g500)); border-color:transparent; color:var(--on-g)}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{justify-content:center; min-height:64px; padding:12px}
.opts.two .opt .ck{display:none}
.opts.two .opt[aria-pressed="true"]{background:var(--t50, var(--g50)); box-shadow:inset 0 0 0 1px var(--t600, var(--g500))}
.big-step{padding:22px 16px; border-radius:28px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1); text-align:center}
.big-step .v{font-size:72px; font-weight:800; letter-spacing:-.05em; line-height:1; font-variant-numeric:tabular-nums}
.big-step .v small{font-size:24px; font-weight:600; color:var(--muted); letter-spacing:0; margin-left:4px}
.big-step .row{display:flex; gap:10px; justify-content:center; margin-top:20px}
.big-step .row button{width:64px; height:64px; border-radius:20px; background:var(--n50); font-size:26px; font-weight:700; display:grid; place-items:center; transition:background .15s, transform .12s, color .15s}
.big-step .row button:hover{background:var(--a50); color:var(--a700)}
.big-step .row button:active{transform:scale(.93)}
.big-step .row button.w{width:auto; padding:0 18px; font-size:18px}
.prev{margin-top:14px; padding:14px 16px; border-radius:20px; background:var(--surface); border:1px solid var(--line)}
.prev .r{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-bottom:10px}
.prev .r b{color:var(--ink)}
.cam{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; width:100%; min-height:130px; border-radius:26px; border:2px dashed var(--line-2); background:var(--surface); font-size:17px; font-weight:600; color:var(--muted); transition:border-color .2s, background .2s, color .2s}
.cam:hover{border-color:var(--g400); background:var(--g25); color:var(--g600)}
.cam .ci{width:56px; height:56px; border-radius:18px; background:var(--g50); color:var(--g600); display:grid; place-items:center}
.cam.small{min-height:64px; flex-direction:row; font-size:16px}
.cam.small .ci{width:40px; height:40px; border-radius:13px}
.shots{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px}
.shot{aspect-ratio:4/3; border-radius:14px; overflow:hidden; background:var(--n100)}
.shot>svg{width:100%; height:100%; display:block}
.shot.snap{animation:snap .5s ease}
@keyframes snap{0%{filter:brightness(2.4)}}
.fl{font-size:15px; font-weight:700; margin:24px 2px 10px}
.fld{width:100%; min-height:56px; padding:14px 16px; border-radius:18px; border:1.5px solid var(--line-2); background:var(--surface); font-size:17px; transition:border-color .15s, box-shadow .15s}
textarea.fld{min-height:96px; resize:none}
.fld:focus{outline:none; border-color:var(--g500); box-shadow:0 0 0 4px var(--g50)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:44px; padding:0 18px; border-radius:22px; background:var(--surface); border:1.5px solid var(--line-2); font-size:16px; font-weight:600; transition:background .15s, border-color .15s, color .15s}
.chip:hover{border-color:var(--g400); background:var(--g25)}
.chip[aria-pressed="true"]{background:var(--g600); border-color:var(--g600); color:var(--on-g)}
.pfoot{flex:none; padding:14px 22px 24px}
.go{width:100%; height:64px; border-radius:22px; background:linear-gradient(140deg, var(--a300), var(--a400)); color:var(--a900); font-size:18.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:10px; box-shadow:0 14px 26px -14px rgba(226,162,0,.9); transition:transform .2s var(--ease), box-shadow .2s, filter .2s}
.go:hover{transform:translateY(-2px); box-shadow:0 20px 32px -14px rgba(226,162,0,1); filter:saturate(1.1)}
.go:active{transform:scale(.99)}
.go:disabled{background:var(--n100); color:var(--faint); box-shadow:none; transform:none; filter:none}
.go.dark{background:var(--ink); color:var(--surface); box-shadow:var(--sh-2)}
.okscr{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px}
.okscr .oc{width:104px; height:104px; border-radius:50%; background:var(--g500); color:var(--on-g); display:grid; place-items:center; box-shadow:0 0 0 14px var(--g50), 0 0 0 28px var(--g25); animation:okpop .6s var(--ease)}
@keyframes okpop{0%{transform:scale(.4); opacity:0} 60%{transform:scale(1.08)}}
.okscr h3{font-size:28px; font-weight:800; margin-top:40px; letter-spacing:-.03em}
.okscr p{font-size:17px; color:var(--muted); margin-top:8px; max-width:24ch}
.ptoast{position:absolute; left:18px; right:18px; top:48px; z-index:7; padding:14px 16px; border-radius:20px; background:var(--ink); color:var(--surface); font-size:15px; font-weight:600; display:flex; align-items:center; gap:10px; box-shadow:var(--sh-2); animation:drop .45s var(--ease), fadeout .4s ease 2.6s forwards}
.ptoast i{width:30px; height:30px; border-radius:10px; background:var(--g500); color:var(--on-g); display:grid; place-items:center}
@keyframes drop{from{transform:translateY(-24px); opacity:0}}
@keyframes fadeout{to{opacity:0; transform:translateY(-12px)}}
.sheetp{position:absolute; inset:0; z-index:8; background:rgba(19,26,23,.32); display:flex; align-items:flex-end; animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheetp .pan{width:100%; background:var(--surface); border-radius:30px 30px 0 0; padding:12px 20px 28px; animation:up .3s var(--ease)}
@keyframes up{from{transform:translateY(40px)}}
.sheetp .grab{width:44px; height:5px; border-radius:3px; background:var(--n200); margin:0 auto 16px}
.sheetp h4{font-size:20px; font-weight:800; margin:0 2px 14px}
.jopt{display:block; width:100%; text-align:left; padding:14px 16px; border-radius:20px; border:1.5px solid var(--line); margin-bottom:10px; transition:border-color .2s, background .2s}
.jopt:hover{border-color:var(--g200); background:var(--g25)}
.jopt[aria-pressed="true"]{border-color:var(--g500); background:var(--g25)}
.jopt b{display:block; font-size:17px; font-weight:700; margin-bottom:10px}
.jopt small{display:block; font-size:13px; color:var(--muted); margin-top:6px}

/* Mis envíos */
.env-h{font-size:28px; font-weight:800; letter-spacing:-.03em; margin:8px 2px 4px}
.env-s{font-size:15px; color:var(--muted); margin:0 2px 20px}
.mine{padding:16px 18px; border-radius:22px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px; transition:transform .2s var(--ease), border-color .2s, box-shadow .2s}
.mine:hover{transform:translateY(-2px); border-color:var(--line-2); box-shadow:var(--sh-1)}
.mine .h{display:flex; align-items:center; gap:12px}
.mine .mi{width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--t50); color:var(--t600); flex:none}
.mine .h div{flex:1; min-width:0}
.mine .h b{display:block; font-size:16.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mine .h small{display:block; font-size:13.5px; color:var(--muted)}
.mine .h time{font-size:13px; color:var(--faint); align-self:flex-start}
.state{display:inline-flex; align-items:center; gap:7px; margin-top:12px; padding:6px 12px; border-radius:12px; font-size:14px; font-weight:600}
.state.wait{background:var(--n50); color:var(--muted)}
.state.seen{background:var(--b50); color:var(--b500)}
.state .spin{width:13px; height:13px; border-radius:50%; border:2px solid var(--line-2); border-top-color:var(--muted); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reply{margin-top:10px; padding:11px 14px; border-radius:18px 18px 18px 6px; background:var(--g50); font-size:15.5px; font-weight:500}
.reply small{display:block; color:var(--g600); font-weight:700; font-size:12.5px; margin-bottom:2px}
.mine.arrive{animation:arrive2 1.4s var(--ease)}
@keyframes arrive2{0%,45%{box-shadow:0 0 0 4px var(--b100); border-color:var(--b500)}}

/* ---------- Oficina ---------- */
.office{border-radius:30px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-2); display:flex; flex-direction:column; overflow:hidden; position:relative}
.o-top{flex:none; display:flex; align-items:center; gap:14px; padding:20px 24px; background:linear-gradient(120deg, var(--g25), var(--surface) 70%); border-bottom:1px solid var(--line)}
.o-top .oi{width:44px; height:44px; border-radius:14px; background:linear-gradient(145deg, var(--g500), var(--g600)); color:var(--on-g); display:grid; place-items:center; box-shadow:0 8px 16px -8px rgba(30,138,85,.7)}
.o-top b{display:block; font-size:18px; font-weight:700}
.o-top small{display:block; font-size:13.5px; color:var(--muted)}
.stats{margin-left:auto; display:flex; gap:8px}
.stat{padding:9px 14px; border-radius:16px; background:var(--t50); min-width:104px; transition:transform .2s var(--ease), background .2s}
.stat:hover{transform:translateY(-2px); background:var(--t100)}
.stat small{display:block; font-size:12.5px; color:var(--t600); font-weight:600}
.stat b{display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15}
.o-cols{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.o-col{padding:22px 24px 28px}
.o-col + .o-col{border-left:1px solid var(--line); background:var(--n25)}
.o-h{display:flex; align-items:center; gap:8px; margin:0 2px 14px}
.o-h h3{font-size:15.5px; font-weight:700}
.o-h .n{font-size:12.5px; color:var(--muted); background:var(--n50); padding:2px 9px; border-radius:10px; font-weight:600}
.it{display:flex; gap:14px; padding:16px; border-radius:22px; border:1px solid var(--line); background:var(--surface); margin-bottom:12px; transition:transform .25s var(--ease), box-shadow .25s, border-color .25s, background .25s, opacity .25s}
.it:hover{transform:translateY(-3px); box-shadow:var(--sh-2); border-color:var(--t100); background:var(--t25)}
.it.nuevo{background:var(--r25); border-color:var(--r100)}
.it.nuevo:hover{background:var(--r50); border-color:var(--r100)}
.it.done{opacity:.7}
.it.done:hover{opacity:1}
.it-ic{width:44px; height:44px; border-radius:15px; display:grid; place-items:center; flex:none; background:var(--t50); color:var(--t600); transition:transform .3s var(--ease), background .25s}
.it:hover .it-ic{transform:rotate(-6deg) scale(1.06); background:var(--t100)}
.it-b{flex:1; min-width:0}
.it-h{display:flex; align-items:center; gap:8px}
.it-h b{font-size:15.5px; font-weight:700}
.it-h time{margin-left:auto; font-size:12.5px; color:var(--faint); white-space:nowrap}
.it-b p{font-size:15px; margin-top:3px}
.it-b .qt{color:var(--muted)}
.it-meta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:10px}
.jl{font-size:13px; font-weight:600; padding:4px 10px; border-radius:10px; background:var(--n50); color:var(--ink); transition:background .15s, color .15s}
.jl:hover{background:var(--g50); color:var(--g600)}
.by{font-size:13px; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:10px}
.pill.red{background:var(--r50); color:var(--r500)}
.pill.blue{background:var(--b50); color:var(--b500)}
.pill.ok{background:var(--g50); color:var(--g600)}
.pill.red::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; animation:blink 1.6s infinite}
.it-shots{display:flex; gap:6px; margin-top:10px}
.it-shots .shot{width:64px; border-radius:10px}
.it-act{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.btn{white-space:nowrap; height:38px; padding:0 15px; border-radius:13px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:background .15s, transform .2s var(--ease), box-shadow .2s, border-color .15s, color .15s}
.btn.pri{background:var(--g600); color:var(--on-g); box-shadow:0 8px 16px -10px rgba(21,114,70,.8)}
.btn.pri:hover{background:var(--g700); transform:translateY(-1px); box-shadow:0 12px 20px -10px rgba(21,114,70,.9)}
.btn.sec{background:var(--surface); border:1.5px solid var(--line-2)}
.btn.sec:hover{border-color:var(--g400); background:var(--g25); color:var(--g700)}
.it-reply{margin-top:10px; padding:10px 13px; border-radius:16px 16px 6px 16px; background:var(--g50); font-size:14.5px}
.it-reply small{display:block; font-size:12px; color:var(--g600); font-weight:700}
.it.arrive{animation:arrive 1.3s var(--ease)}
@keyframes arrive{0%{transform:translateY(-10px) scale(.97); opacity:0} 40%{opacity:1; box-shadow:0 0 0 5px var(--a100)} 100%{transform:none}}
.job{display:block; width:100%; text-align:left; padding:16px; border-radius:22px; background:var(--surface); border:1px solid var(--line); margin-bottom:12px; transition:transform .25s var(--ease), box-shadow .25s, border-color .25s, background .25s}
.job:hover{transform:translateY(-3px); box-shadow:var(--sh-2); border-color:var(--g100); background:var(--g25)}
.job .h{display:flex; align-items:flex-start; gap:8px; margin-bottom:12px}
.job .h b{display:block; font-size:15.5px; font-weight:700}
.job .h small{display:block; font-size:13px; color:var(--muted)}
.job .h .chev{margin-left:auto; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; color:var(--faint); transition:.25s var(--ease)}
.job:hover .h .chev{background:var(--g100); color:var(--g700); transform:translateX(2px)}
.job .f{display:flex; justify-content:space-between; margin-top:9px; font-size:13px; color:var(--muted)}
.job .f b{color:var(--ink); font-weight:700}
.job.flash{animation:flash 1.5s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 4px var(--a100); border-color:var(--a400)}}

/* Cerca: avance en metros */
.fence{position:relative; height:var(--fh,12px); border-radius:4px; background:repeating-linear-gradient(90deg, var(--line-2) 0 2px, transparent 2px 16px) left bottom/100% 35% no-repeat; border-bottom:2px solid var(--line)}
.fence>i{position:absolute; left:0; top:0; bottom:-2px; width:var(--p); border-top:2px solid var(--post); border-bottom:2px solid var(--post); transition:width .9s var(--ease);
  background:repeating-linear-gradient(90deg, var(--post) 0 2px, transparent 2px 16px), repeating-linear-gradient(45deg, var(--mesh) 0 1px, transparent 1px 5px), repeating-linear-gradient(-45deg, var(--mesh) 0 1px, transparent 1px 5px)}
.fence.big{--fh:30px; background:repeating-linear-gradient(90deg, var(--line-2) 0 2px, transparent 2px 26px) left bottom/100% 30% no-repeat}
.fence.big>i{background:repeating-linear-gradient(90deg, var(--post) 0 3px, transparent 3px 26px), repeating-linear-gradient(45deg, var(--mesh) 0 1px, transparent 1px 6px), repeating-linear-gradient(-45deg, var(--mesh) 0 1px, transparent 1px 6px)}
.fence .add-p{position:absolute; top:0; bottom:-2px; left:var(--p); width:var(--a); background:repeating-linear-gradient(45deg, rgba(247,185,23,.95) 0 1px, transparent 1px 5px), repeating-linear-gradient(-45deg, rgba(247,185,23,.95) 0 1px, transparent 1px 5px); border-top:2px solid var(--a500); border-bottom:2px solid var(--a500); transition:width .3s var(--ease)}

/* Detalle del trabajo */
.sheet{position:fixed; top:0; right:0; bottom:0; width:min(560px,100%); z-index:41; background:var(--surface); display:flex; flex-direction:column; box-shadow:var(--sh-3); animation:sheet .32s var(--ease); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes sheet{from{transform:translateX(28px); opacity:0}}
.sh-top{flex:none; display:flex; align-items:center; gap:12px; padding:18px 24px; border-bottom:1px solid var(--line); background:linear-gradient(120deg, var(--g25), var(--surface) 70%)}
.sh-top .x{width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--line); transition:background .15s, border-color .15s}
.sh-top .x:hover{background:var(--g50); border-color:var(--g200)}
.sh-top b{display:block; font-size:19px; font-weight:700}
.sh-top small{display:block; font-size:13.5px; color:var(--muted)}
.sh-b{flex:1; overflow-y:auto; padding:22px 24px 30px}
.sh-prog{padding:20px; border-radius:24px; background:var(--g25); border:1px solid var(--g100)}
.sh-prog .m{display:flex; align-items:baseline; gap:8px; margin-bottom:14px}
.sh-prog .m b{font-size:36px; font-weight:800; letter-spacing:-.04em; line-height:1}
.sh-prog .m span{color:var(--muted)}
.sh-prog .m em{margin-left:auto; font-style:normal; font-size:22px; font-weight:800; color:var(--g600)}
.sh-kpi{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.sh-kpi div{padding:13px 15px; border-radius:18px; background:var(--n25); border:1px solid var(--line); transition:background .2s, border-color .2s}
.sh-kpi div:hover{background:var(--g25); border-color:var(--g100)}
.sh-kpi small{display:block; font-size:12.5px; color:var(--muted)}
.sh-kpi b{font-size:16px; font-weight:700}
.sh-h{font-size:15px; font-weight:700; margin:24px 2px 12px}
.tl{list-style:none; margin:0; padding:0; position:relative}
.tl::before{content:""; position:absolute; left:17px; top:8px; bottom:8px; width:2px; background:var(--line)}
.tl li{position:relative; display:flex; gap:12px; padding:0 0 16px}
.tl .d{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--t50); color:var(--t600); flex:none; z-index:1}
.tl .x{font-size:14.5px; padding-top:6px}
.tl time{display:block; font-size:12.5px; color:var(--faint)}
.sh-shots{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.sh-shots .shot{transition:transform .3s var(--ease), box-shadow .3s}
.sh-shots .shot:hover{transform:scale(1.05); box-shadow:var(--sh-2)}

.toast{position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px); z-index:90; padding:12px 18px; border-radius:18px; background:var(--ink); color:var(--surface); font-size:15px; font-weight:600; display:flex; align-items:center; gap:10px; opacity:0; pointer-events:none; transition:.28s var(--ease); box-shadow:var(--sh-3); white-space:nowrap; max-width:calc(100% - 28px)}
.toast.on{opacity:1; transform:translate(-50%,0); pointer-events:auto}
.toast button{color:var(--a300); font-weight:700}


/* ---------- Selector de apps y herramientas ---------- */
.appsw{display:flex; gap:4px; padding:4px; border-radius:15px; background:var(--n50); border:1px solid var(--line)}
.sw-b{position:relative; display:flex; align-items:center; gap:9px; height:40px; padding:0 16px 0 6px; border-radius:11px; font-size:14.5px; font-weight:600; color:var(--muted); transition:background .2s, color .2s, box-shadow .2s}
.sw-b .si{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--t50); color:var(--t600); transition:transform .3s var(--ease), background .2s, color .2s}
.sw-b:hover{color:var(--ink); background:var(--surface)}
.sw-b:hover .si{transform:scale(1.08) rotate(-5deg)}
.sw-b[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh-1)}
.sw-b.tg[aria-current="true"] .si{background:var(--g600); color:var(--on-g)}
.sw-b.ta[aria-current="true"] .si{background:var(--a400); color:var(--a900)}
.sw-b .bd{position:absolute; top:-6px; left:26px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--r500); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2.5px var(--surface)}
.sw-b .bd.pop{animation:pop .5s var(--ease)}
.tools{margin-left:auto; display:flex; align-items:center; gap:10px}
.search{position:relative; display:flex; align-items:center}
.search svg{position:absolute; left:13px; color:var(--faint); pointer-events:none}
.search input{width:280px; height:42px; padding:0 14px 0 40px; border-radius:14px; border:1.5px solid var(--line); background:var(--n25); font-size:14.5px; transition:border-color .15s, box-shadow .15s, background .15s, width .25s var(--ease)}
.search input:hover{border-color:var(--line-2)}
.search input:focus{outline:none; border-color:var(--g400); background:var(--surface); box-shadow:0 0 0 4px var(--g50); width:320px}
.ib{position:relative; width:42px; height:42px; border-radius:14px; display:grid; place-items:center; color:var(--muted); border:1.5px solid var(--line); background:var(--surface); transition:background .15s, color .15s, border-color .15s}
.ib:hover{background:var(--g25); color:var(--g600); border-color:var(--g200)}
.ib .bd{position:absolute; top:-6px; right:-6px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--r500); color:#fff; font-size:11.5px; font-weight:700; display:grid; place-items:center; box-shadow:0 0 0 2.5px var(--surface)}
.me2{display:flex; align-items:center; gap:10px; padding:4px 12px 4px 4px; border-radius:14px; transition:background .15s}
.me2:hover{background:var(--n50)}
.me2 .av{width:36px; height:36px; border-radius:12px; background:linear-gradient(145deg, var(--b500), var(--b700)); color:var(--n0); display:grid; place-items:center; font-weight:700; font-size:13px}
.me2 b{display:block; font-size:14px; font-weight:700; line-height:1.2}
.me2 small{display:block; font-size:12px; color:var(--muted)}
.main{flex:1; overflow-y:auto; min-height:0; background:var(--bg)}
.view[hidden]{display:none}
.view{animation:vin .3s var(--ease)}
@keyframes vin{from{opacity:0}}

/* ---------- App de oficina ---------- */
.oapp{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100%}
.sb{position:sticky; top:0; align-self:start; height:calc(100vh - 66px); padding:22px 14px; border-right:1px solid var(--line); background:var(--surface); display:flex; flex-direction:column; gap:4px}
.nav{display:flex; align-items:center; gap:12px; width:100%; height:46px; padding:0 12px; border-radius:14px; font-size:15px; font-weight:600; color:var(--muted); text-align:left; transition:background .15s, color .15s}
.nav .ni{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--n50); transition:background .2s, color .2s, transform .3s var(--ease)}
.nav:hover{background:var(--g25); color:var(--ink)}
.nav:hover .ni{transform:scale(1.06)}
.nav[aria-current="true"]{background:var(--g50); color:var(--g700)}
.nav[aria-current="true"] .ni{background:var(--g600); color:var(--on-g)}
.nav .cnt{margin-left:auto; min-width:22px; height:22px; padding:0 7px; border-radius:11px; background:var(--r500); color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center}
.nav .cnt.soft{background:var(--n100); color:var(--muted)}
.sb-sec{font-size:12.5px; font-weight:700; color:var(--faint); margin:22px 12px 8px}
.crew-r{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; font-size:14px; font-weight:600; transition:background .15s}
.crew-r:hover{background:var(--n50)}
.crew-r .ca{width:30px; height:30px; border-radius:10px; background:var(--a50); color:var(--a700); display:grid; place-items:center; font-size:11.5px; font-weight:800}
.crew-r small{display:block; font-size:12px; color:var(--muted); font-weight:500}
.crew-r .on{margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--g500); box-shadow:0 0 0 3px var(--g50)}
.op{padding:30px 34px 60px; min-width:0}
.op-h{display:flex; align-items:flex-end; gap:20px; margin-bottom:22px; flex-wrap:wrap}
.op-h h1{font-size:30px; letter-spacing:-.03em}
.op-h p{color:var(--muted); font-size:15px; margin-top:2px}
.op-h .stats{margin-left:auto}
.filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap}
.fchip{height:38px; padding:0 15px; border-radius:13px; font-size:14px; font-weight:600; color:var(--muted); background:var(--surface); border:1.5px solid var(--line); display:flex; align-items:center; gap:8px; transition:background .15s, border-color .15s, color .15s}
.fchip:hover{border-color:var(--line-2); color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
.fchip .n{font-size:12px; opacity:.7}
.op-grid{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:26px; align-items:start}
.rail{position:sticky; top:24px; padding:20px; border-radius:26px; background:var(--surface); border:1px solid var(--line)}
.rail h3{font-size:15.5px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:baseline}
.rail h3 button{font-size:13.5px; color:var(--g600); font-weight:600; border-radius:8px; padding:0 4px}
.rail h3 button:hover{text-decoration:underline}
.rj{display:block; width:100%; text-align:left; padding:13px 14px; border-radius:18px; margin-bottom:8px; background:var(--n25); border:1px solid var(--line); transition:transform .2s var(--ease), background .2s, border-color .2s, box-shadow .2s}
.rj:hover{background:var(--g25); border-color:var(--g100); transform:translateY(-2px); box-shadow:var(--sh-1)}
.rj .t{display:flex; justify-content:space-between; gap:8px; font-size:14.5px; font-weight:700; margin-bottom:9px}
.rj .t em{font-style:normal; color:var(--g600)}
.rj small{display:block; font-size:12.5px; color:var(--muted); margin-top:7px}
.empty{padding:40px 20px; text-align:center; color:var(--muted); border-radius:22px; border:1.5px dashed var(--line-2)}
.jgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:16px}
.jc{display:block; width:100%; text-align:left; padding:20px; border-radius:26px; background:var(--surface); border:1px solid var(--line); transition:transform .25s var(--ease), box-shadow .25s, border-color .25s, background .25s}
.jc:hover{transform:translateY(-4px); box-shadow:var(--sh-2); border-color:var(--g100); background:var(--g25)}
.jc .h{display:flex; align-items:flex-start; gap:10px; margin-bottom:16px}
.jc .h b{display:block; font-size:17px; font-weight:700}
.jc .h small{display:block; font-size:13.5px; color:var(--muted)}
.jc .h .chev{margin-left:auto; width:34px; height:34px; border-radius:11px; display:grid; place-items:center; color:var(--faint); background:var(--n50); transition:.25s var(--ease)}
.jc:hover .h .chev{background:var(--g100); color:var(--g700); transform:translateX(3px)}
.jc .m{display:flex; align-items:baseline; gap:6px; margin-top:12px}
.jc .m b{font-size:26px; font-weight:800; letter-spacing:-.03em}
.jc .m span{color:var(--muted); font-size:14px}
.jc .m em{margin-left:auto; font-style:normal; font-weight:800; font-size:18px; color:var(--g600)}
.jc .ft{display:flex; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); align-items:center}
.jc .ft .kv{font-size:13px; color:var(--muted)}
.jc .ft .kv b{color:var(--ink); font-weight:700}
.jc .ft .th{margin-left:auto; display:flex; gap:4px}
.jc .ft .th .shot{width:44px; border-radius:8px}
.it.fresh{animation:arrive 1.4s var(--ease)}
.it .newtag{font-size:11.5px; font-weight:800; color:var(--a900); background:var(--a300); padding:2px 8px; border-radius:8px}

/* ---------- App de campo ---------- */
.campo-stage{min-height:100%; display:grid; place-items:center; padding:28px 20px; background:radial-gradient(700px 500px at 50% 30%, var(--g50), transparent 70%), var(--bg)}

@media (max-width:1180px){
  .op-grid{grid-template-columns:1fr}
  .rail{position:static}
  .search input{width:200px}
  .search input:focus{width:240px}
}
@media (max-width:900px){
  .top{height:auto; padding:10px 14px; flex-wrap:wrap; row-gap:10px}
  .brand small{display:none}
  .tools{gap:6px}
  .search, .me2 div{display:none}
  .appsw{order:3; width:100%}
  .sw-b{flex:1; justify-content:center}
  .oapp{grid-template-columns:1fr}
  .sb{position:static; height:auto; flex-direction:row; padding:10px 14px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto}
  .sb-sec, .crew-r{display:none}
  .nav{width:auto; flex:1}
  .op{padding:22px 16px 60px}
  .op-h .stats{margin-left:0; width:100%}
  .stat{flex:1; min-width:0}
  .campo-stage{padding:0; place-items:stretch}

}
.scrim{position:fixed; inset:0; z-index:40; background:rgba(19,26,23,.35); animation:fade .2s ease}

/* ---------- Campo: actividad ---------- */
.state.amber{background:var(--a50); color:var(--a700)}
.state.ok{background:var(--g50); color:var(--g600)}
.mtext{font-size:16px; margin-top:12px; line-height:1.45}
.ackb{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; height:52px; margin-top:12px; border-radius:17px; background:var(--g600); color:var(--on-g); font-size:16.5px; font-weight:700; box-shadow:0 10px 20px -12px rgba(21,114,70,.8); transition:transform .2s var(--ease), background .15s}
.ackb:hover{background:var(--g700); transform:translateY(-1px)}
.banner{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-top:12px; padding:13px 14px; border-radius:18px; background:var(--t50); border:1px solid var(--t100); transition:transform .2s var(--ease), box-shadow .2s}
.banner:hover{transform:translateY(-2px); box-shadow:var(--sh-1)}
.banner .bi{width:40px; height:40px; border-radius:13px; display:grid; place-items:center; background:var(--surface); color:var(--t600); flex:none}
.banner small{display:block; font-size:12.5px; font-weight:700; color:var(--t600)}
.banner b{display:block; font-size:14.5px; font-weight:600; line-height:1.3; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}

/* ---------- Oficina: página del trabajo ---------- */
.btn.lg{height:44px; padding:0 18px; border-radius:15px; font-size:15px}
.btn.ghost{color:var(--g600); padding:0 10px}
.btn.ghost:hover{background:var(--g50)}
.pill{background:var(--n50); color:var(--muted)}
.pill.amber{background:var(--a50); color:var(--a700)}
.ca{width:30px; height:30px; border-radius:10px; background:var(--a50); color:var(--a700); display:grid; place-items:center; font-size:11.5px; font-weight:800; flex:none}
.ca.big{width:42px; height:42px; border-radius:14px; font-size:14px}
.ca.mat{background:var(--b50); color:var(--b500)}
.crumb{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--faint); margin-bottom:14px}
.crumb button{color:var(--muted); font-weight:600; border-radius:8px; padding:2px 6px; margin-left:-6px; transition:background .15s, color .15s}
.crumb button:hover{background:var(--g50); color:var(--g700)}
.crumb span{color:var(--ink); font-weight:600}
.jh{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:22px}
.jh h1{font-size:32px; letter-spacing:-.035em; line-height:1.1}
.jh p{color:var(--muted); font-size:15.5px; margin-top:4px}
.jh-a{margin-left:auto; display:flex; gap:10px}
.jsum{display:grid; grid-template-columns:2fr 1fr 1.2fr 1fr; gap:14px; margin-bottom:24px}
.sc{display:flex; flex-direction:column; gap:6px; text-align:left; padding:18px 20px; border-radius:24px; background:var(--surface); border:1px solid var(--line); transition:transform .25s var(--ease), box-shadow .25s, border-color .25s, background .25s}
.sc:hover{transform:translateY(-3px); box-shadow:var(--sh-2); border-color:var(--line-2)}
.sc-b:hover{background:var(--a25); border-color:var(--a100)}
.sc>small{font-size:13px; font-weight:700; color:var(--muted)}
.sc .big{font-size:22px; font-weight:800; letter-spacing:-.02em}
.sc .sub{font-size:13.5px; color:var(--muted); margin-top:auto}
.sc-av{background:linear-gradient(130deg, var(--g25), var(--surface) 75%)}
.sc-av .m{display:flex; align-items:baseline; gap:7px; margin-bottom:6px}
.sc-av .m b{font-size:30px; font-weight:800; letter-spacing:-.04em; line-height:1}
.sc-av .m span{color:var(--muted)}
.sc-av .m em{margin-left:auto; font-style:normal; font-size:20px; font-weight:800; color:var(--g600)}
.sc-av .sub{margin-top:8px}
.cr{display:flex; align-items:center; gap:10px; font-size:17px}
.lnk{margin-top:auto; align-self:flex-start; color:var(--g600); font-weight:700; font-size:14px; border-radius:8px; padding:2px 4px; margin-left:-4px}
.lnk:hover{background:var(--g50)}
.jtabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:22px}
.jtabs button{display:flex; align-items:center; gap:8px; padding:12px 16px; font-size:15px; font-weight:600; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; border-radius:10px 10px 0 0; transition:color .15s, background .15s, border-color .15s}
.jtabs button:hover{color:var(--ink); background:var(--n25)}
.jtabs button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--g500)}
.jtabs span{font-size:12px; font-weight:700; padding:1px 8px; border-radius:9px; background:var(--n50); color:var(--muted)}
.jtabs button[aria-pressed="true"] span{background:var(--g50); color:var(--g600)}
.jbody{max-width:900px}
.composer{padding:18px; border-radius:24px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--sh-1); margin-bottom:26px; transition:border-color .2s, box-shadow .2s}
.composer:focus-within{border-color:var(--g200); box-shadow:0 0 0 4px var(--g50)}
.cp-h{display:flex; align-items:center; gap:10px; margin-bottom:12px; font-size:15px}
.cp-h .muted{margin-left:auto; font-size:13px; color:var(--muted)}
.av2{width:32px; height:32px; border-radius:11px; background:linear-gradient(145deg, var(--b500), var(--b700)); color:var(--n0); display:grid; place-items:center; font-weight:700; font-size:12px}
.composer .fld{min-height:84px; font-size:15.5px; border-color:var(--line); background:var(--n25)}
.composer .fld:focus{box-shadow:none; border-color:var(--g400); background:var(--surface)}
.cp-f{display:flex; align-items:flex-end; gap:12px; margin-top:12px}
.qchips{display:flex; gap:6px; flex-wrap:wrap; flex:1}
.qc{height:32px; padding:0 12px; border-radius:11px; font-size:13px; font-weight:600; color:var(--muted); background:var(--n50); transition:background .15s, color .15s}
.qc:hover{background:var(--b50); color:var(--b700)}
.tl2{list-style:none; margin:0; padding:0; position:relative}
.tl2::before{content:""; position:absolute; left:19px; top:10px; bottom:10px; width:2px; background:var(--line)}
.tl2 li{position:relative; display:flex; gap:14px; padding-bottom:18px}
.tl2 .d{width:40px; height:40px; border-radius:14px; display:grid; place-items:center; background:var(--t50); color:var(--t600); flex:none; z-index:1; box-shadow:0 0 0 4px var(--bg)}
.tl2 .c{flex:1; min-width:0; padding:10px 16px 12px; border-radius:18px; background:var(--surface); border:1px solid var(--line); transition:border-color .2s, box-shadow .2s, background .2s}
.tl2 li:hover .c{border-color:var(--t100); background:var(--t25); box-shadow:var(--sh-1)}
.tl2 .h{font-size:15px}
.tl2 .q2{color:var(--muted)}
.tl2 time{display:block; font-size:12.5px; color:var(--faint); margin-top:8px}
.tl2 .pill{margin-top:8px}
.bub{display:flex; align-items:center; gap:8px; margin-top:8px; padding:9px 12px; border-radius:14px; background:var(--g50); font-size:14px}
.bub.out{background:var(--b50); color:var(--ink); font-size:15px}
.tab-h{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.tab-h h3{font-size:18px}
.tab-h p{font-size:14px; color:var(--muted)}
.tab-h .btn{margin-left:auto}
.mrow2{display:grid; grid-template-columns:44px minmax(0,1fr) 300px 170px; gap:16px; align-items:center; padding:16px 18px; border-radius:22px; background:var(--surface); border:1px solid var(--line); margin-bottom:10px; transition:transform .2s var(--ease), box-shadow .2s, border-color .2s}
.mrow2:hover{transform:translateY(-2px); box-shadow:var(--sh-2); border-color:var(--line-2)}
.mrow2.fresh{animation:arrive 1.3s var(--ease)}
.mi2{width:44px; height:44px; border-radius:15px; display:grid; place-items:center; background:var(--a50); color:var(--a700)}
.mn b{display:block; font-size:15.5px; font-weight:700}
.mn small{display:block; font-size:13px; color:var(--muted); margin-top:2px}
.mn .nt{font-style:italic}
.ma{text-align:right}
.mstep{display:grid; grid-template-columns:repeat(4,1fr); position:relative}
.mstep div{display:flex; flex-direction:column; align-items:center; gap:6px; position:relative}
.mstep div::before{content:""; position:absolute; top:10px; right:50%; width:100%; height:2px; background:var(--line)}
.mstep div:first-child::before{display:none}
.mstep div.on::before, .mstep div.cur::before{background:var(--g400)}
.mstep i{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--surface); border:2px solid var(--line-2); color:#fff; z-index:1}
.mstep .on i{background:var(--g500); border-color:var(--g500); color:var(--on-g)}
.mstep .cur i{background:var(--a400); border-color:var(--a400); color:var(--a900); box-shadow:0 0 0 4px var(--a50)}
.mstep small{font-size:11.5px; color:var(--faint); font-weight:600; white-space:nowrap}
.mstep .on small{color:var(--muted)}
.mstep .cur small{color:var(--ink)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:14px}
.pgrid figure{margin:0; transition:transform .25s var(--ease)}
.pgrid figure:hover{transform:translateY(-3px)}
.pgrid .shot{border-radius:18px}
.pgrid figcaption{font-size:13px; color:var(--muted); margin-top:7px}
.pgrid figcaption b{display:block; color:var(--ink); font-size:14px}
.dl{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.dl div{padding:16px 18px; border-radius:20px; background:var(--surface); border:1px solid var(--line); transition:border-color .2s, background .2s}
.dl div:hover{border-color:var(--g100); background:var(--g25)}
.dl small{display:block; font-size:12.5px; font-weight:700; color:var(--muted)}
.dl b{display:block; font-size:15.5px; font-weight:600; margin-top:3px}

/* ---------- Ventanas ---------- */
.modal{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(600px, calc(100% - 24px)); max-height:calc(100% - 40px); z-index:41; display:flex; flex-direction:column; background:var(--surface); border-radius:28px; box-shadow:var(--sh-3); animation:mdin .28s var(--ease)}
@keyframes mdin{from{opacity:0; transform:translate(-50%,-46%) scale(.98)}}
.md-h{display:flex; align-items:flex-start; gap:12px; padding:22px 24px 14px}
.md-h h2{font-size:22px; letter-spacing:-.025em}
.md-h p{font-size:14px; color:var(--muted); margin-top:2px}
.md-h .ib{margin-left:auto}
.md-b{overflow-y:auto; padding:4px 24px 20px}
.md-f{display:flex; align-items:center; gap:10px; padding:16px 24px 20px; border-top:1px solid var(--line)}
.md-f .note{margin-right:auto; font-size:13px; color:var(--muted)}
.ml{display:block; font-size:13.5px; font-weight:700; margin:16px 2px 8px}
.mchips{display:flex; flex-wrap:wrap; gap:8px}
.fld.sm{min-height:46px; padding:11px 14px; font-size:15px; border-radius:14px}
textarea.fld.sm{min-height:70px}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.qty{display:flex; align-items:center; gap:6px; height:46px; padding:4px; border-radius:14px; border:1.5px solid var(--line-2)}
.qty button{width:36px; height:36px; border-radius:10px; background:var(--n50); font-size:18px; font-weight:700; transition:background .15s}
.qty button:hover{background:var(--g50); color:var(--g600)}
.qty input{width:60px; border:0; background:none; text-align:center; font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
.qty input:focus{outline:none}
.qty span{flex:1; font-size:14px; color:var(--muted)}
.seg2{display:flex; gap:4px; padding:4px; border-radius:14px; background:var(--n50); height:46px}
.seg2 button{flex:1; border-radius:10px; font-size:14px; font-weight:600; color:var(--muted); transition:background .15s, color .15s}
.seg2 button:hover{color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--sh-1)}

@media (max-width:1180px){
  .jsum{grid-template-columns:1fr 1fr}
  .mrow2{grid-template-columns:44px minmax(0,1fr) 170px}
  .mrow2 .mstep{grid-column:2 / -1; grid-row:2}
}
@media (max-width:900px){
  .jh-a{margin-left:0; width:100%}
  .jh-a .btn{flex:1; justify-content:center}
  .dl{grid-template-columns:1fr 1fr}
  .cp-f{flex-direction:column; align-items:stretch}
}
@media (max-width:620px){
  .jsum{grid-template-columns:1fr}
  .mrow2{grid-template-columns:44px minmax(0,1fr)}
  .mrow2 .mstep, .mrow2 .ma{grid-column:1 / -1}
  .ma{text-align:left}
  .dl, .mgrid{grid-template-columns:1fr}
  .jtabs{overflow-x:auto}
  .md-f .note{display:none}
  .md-f .btn{flex:1; justify-content:center}
  .jsum{grid-template-columns:1fr 1fr}
  .sc-av{grid-column:1 / -1}
}

.btn:disabled{opacity:.45; box-shadow:none!important; transform:none!important}

/* ---------- Agenda: oficina ---------- */
button.crew-r{width:100%; text-align:left}
.wdays{display:flex; gap:4px; margin-top:4px}
.wdays span{width:24px; height:24px; border-radius:8px; display:grid; place-items:center; font-size:11.5px; font-weight:700; background:var(--n50); color:var(--faint)}
.wdays span.on{background:var(--t100); color:var(--t600)}
.wdays span.t{box-shadow:0 0 0 2px var(--a400)}
.lnks{display:flex; gap:12px; margin-top:auto}
.lnks .lnk{margin-top:0}

.btn.ghost.red:hover{background:var(--r50)}

.ag{display:grid; grid-template-columns:220px minmax(0,1fr); gap:20px; align-items:start}

.ajob{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:16px; margin-bottom:8px; background:var(--t25); border:1px solid var(--t100); cursor:grab; transition:transform .2s var(--ease), box-shadow .2s, background .2s}
.ajob:hover{transform:translateY(-2px); box-shadow:var(--sh-1); background:var(--t50)}
.ajob:active{cursor:grabbing}
.ajob .dot, .popt .dot{width:10px; height:10px; border-radius:50%; background:var(--t600); flex:none}
.ajob b{display:block; font-size:14px; font-weight:700; line-height:1.25}
.ajob small{display:block; font-size:12px; color:var(--muted)}
.ag-warn{display:flex; gap:8px; margin-top:12px; padding:10px 12px; border-radius:14px; background:var(--a50); color:var(--a700); font-size:13px; font-weight:500}
.ag-scroll{overflow-x:auto; border-radius:24px; background:var(--surface); border:1px solid var(--line)}
.ag-grid{display:grid; grid-template-columns:150px repeat(6, minmax(100px,1fr)); min-width:760px}
.agh{padding:14px 10px 12px; text-align:center; border-bottom:1px solid var(--line); position:relative}

.agh b{display:block; font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
.agh span{position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:800; color:var(--a900); background:var(--a300); padding:1px 7px; border-radius:7px}
.agh.today{background:var(--a25)}
.agh.today b{color:var(--a700)}
.agh.past b, .agh.past small{color:var(--faint)}
.agc-crew{display:flex; align-items:center; gap:10px; padding:12px; border-top:1px solid var(--line); border-right:1px solid var(--line)}
.agc-crew b{display:block; font-size:14.5px}
.agc-crew small{display:block; font-size:12px; color:var(--muted)}
.agcell{min-height:104px; padding:8px; border-top:1px solid var(--line); border-left:1px solid var(--line); transition:background .15s, box-shadow .15s}
.agcell.today{background:var(--a25)}
.agcell.past{background:repeating-linear-gradient(135deg, transparent 0 8px, var(--n25) 8px 16px)}
.agcell.over{background:var(--g50); box-shadow:inset 0 0 0 2px var(--g400)}
.agcard{height:100%; min-height:86px; padding:10px 11px; border-radius:14px; background:var(--t50); border:1px solid var(--t100); box-shadow:inset 3px 0 0 var(--t600); cursor:grab; display:flex; flex-direction:column; gap:3px; transition:transform .2s var(--ease), box-shadow .2s, background .2s}
.agcard:hover{transform:translateY(-2px); background:var(--t100); box-shadow:inset 3px 0 0 var(--t600), var(--sh-1)}
.agcard b{font-size:13.5px; font-weight:700; line-height:1.25}
.agcard small{font-size:12px; color:var(--muted); line-height:1.3}
.agcard.dragging, .ajob.dragging{opacity:.4}
.agcard.fresh{animation:arrive 1.2s var(--ease)}
.agcell.past .agcard{opacity:.7}
.agadd{width:100%; height:100%; min-height:86px; border-radius:14px; border:1.5px dashed transparent; display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; color:transparent; transition:border-color .15s, color .15s, background .15s}
.agcell:hover .agadd{border-color:var(--line-2); color:var(--muted)}
.agadd:hover{background:var(--g25); border-color:var(--g400)!important; color:var(--g600)!important}
.popts{display:grid; gap:8px}
.popt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:12px 14px; border-radius:16px; border:1.5px solid var(--line); transition:border-color .15s, background .15s}
.popt:hover{border-color:var(--t100); background:var(--t25)}
.popt[aria-pressed="true"]{border-color:var(--t600); background:var(--t25)}
.popt b{display:block; font-size:15px; font-weight:700}
.popt small{display:block; font-size:12.5px; color:var(--muted)}

.where .wn{display:block; font-size:12.5px; color:var(--a700); font-weight:600; margin-top:1px}
.tmrw{display:flex; align-items:center; gap:10px; width:100%; margin-top:10px; padding:11px 14px; border-radius:16px; text-align:left; font-size:14px; color:var(--muted); background:var(--n25); border:1px solid var(--line); transition:background .15s, border-color .15s, color .15s}

.tmrw:hover{background:var(--g25); border-color:var(--g100); color:var(--ink)}

.agnav button:disabled{opacity:.35}
.agd{display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:20px; margin-bottom:10px; background:var(--surface); border:1px solid var(--line); box-shadow:inset 4px 0 0 var(--t600, var(--line-2)); position:relative}
.agd.none{box-shadow:none; background:var(--n25)}

.agd.past{opacity:.6}
.agd .dd{width:46px; text-align:center; flex:none}
.agd .dd small{display:block; font-size:12.5px; font-weight:700; color:var(--muted)}
.agd .dd b{display:block; font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.1}
.agd .dj{flex:1; min-width:0}
.agd .dj b{display:block; font-size:16.5px; font-weight:700; line-height:1.25}
.agd .dj small{display:block; font-size:13px; color:var(--muted)}

.dbk{display:grid; grid-template-columns:90px 1fr; gap:8px; margin-top:12px}
.dbk div{padding:9px 11px; border-radius:12px; background:var(--n25); border:1px solid var(--line)}
.dbk small{display:block; font-size:11.5px; font-weight:700; color:var(--muted)}
.dbk b{display:block; font-size:18px; font-weight:800} .dbk b.sm{font-size:13px; font-weight:700; line-height:1.3}
.dbf{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.dbf div{display:flex; align-items:center; gap:8px; padding:7px 10px; border-top:1px solid var(--line); font-size:13px}
.dbf div:first-child{border-top:0}
.dbf span{flex:1; font-weight:600}
.dbf em{font-style:normal; font-size:12px; color:var(--muted)}
.rel{font-size:12px; font-weight:700; color:var(--b500); background:var(--b50); padding:2px 8px; border-radius:8px}
.rel:hover{background:var(--b100)}
.dba{display:flex; flex-direction:column; gap:6px}
.dba div{display:flex; align-items:center; gap:8px; font-size:13.5px}
.dba .ai2{width:26px; height:26px; border-radius:8px}
.acc{margin-left:auto; font-size:11.5px; font-weight:800; padding:2px 8px; border-radius:8px; white-space:nowrap}
.acc.w{background:var(--g50); color:var(--g700)} .acc.r{background:var(--b50); color:var(--b700)}
.dbmx{overflow-x:auto; border-radius:22px; background:var(--surface); border:1px solid var(--line)}
.dbmx table{width:100%; border-collapse:collapse; font-size:13.5px}
.dbmx th, .dbmx td{padding:9px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
.dbmx th{font-size:12.5px; color:var(--muted); white-space:nowrap; position:sticky; top:0; background:var(--surface)}
.dbmx th .ai2{display:inline-grid; width:22px; height:22px; border-radius:7px; margin-right:6px; vertical-align:middle}
.dbmx td small{display:block; font-size:11.5px; color:var(--faint)}
.dbmx td .acc{margin-left:0}
.dbmx tr.gr td{background:var(--n25); font-size:12px; font-weight:800; color:var(--muted); padding:7px 12px}
.dbmx tbody tr:not(.gr):hover td{background:var(--g25)}
@media (max-width:1320px){ .dbgs{grid-template-columns:1fr; margin-left:70px} .dbmap{grid-template-columns:190px minmax(0,1fr) 300px} }
@media (max-width:1000px){ .dbmap{grid-template-columns:1fr} .dbsvg{display:none} .dbapps{position:static; flex-direction:row; flex-wrap:wrap} .dbapp{width:auto; flex:1 1 160px} .dbgs{margin:16px 0 0} .dbd{position:static; margin-top:16px} }
.seg2.vm button{white-space:nowrap}
/* Modo para insertar vistas en otra página */
.embed .top{display:none}
.embed .oapp{grid-template-columns:minmax(0,1fr)}
.embed .oapp > .sb{display:none}
.embed .main{height:100vh}
.embed .campo-stage{min-height:100vh}

}

  b.mats.forEach((x, i) => { const e = document.querySelector(`[data-bi="m${i}"]`); if(e) e.textContent = money(x.q * x.p); });

  const mo = document.querySelector('[data-bi="mo"]'); if(mo) mo.textContent = money(b.mo.q * b.mo.p);
  const s = $('#bsum'); if(s){ const f = document.activeElement && document.activeElement.dataset.in; s.innerHTML = bsumHTML(b, c, true); if(f === 'bind' || f === 'bmar' || f === 'bdv'){ const e = s.querySelector(`[data-in="${f}"]`); if(e){ e.focus(); e.setSelectionRange(e.value.length, e.value.length); } } }

      <label class="ml">Material</label>${M.lines.length ? `<div class="rlines">${M.lines.map((l, i) => { const s = stk(l.m); return `<div class="rl"><div><b>${MATS[l.m].n}</b><small class="${s < l.q ? 'neg' : ''}">${s < l.q ? `Solo hay ${s} en existencia` : `Hay ${s}. ${money(Math.round(MATS[l.m].ref * PVENTA / 5) * 5)} por ${uq(1, MATS[l.m].u)}`}</small></div>${qtyIn(l, i)}<span class="r">${money(l.q * Math.round(MATS[l.m].ref * PVENTA / 5) * 5)}</span><button class="rdel" data-act="xdel" data-i="${i}" aria-label="Quitar">${ico('x', 14, 2.2)}</button></div>`; }).join('')}</div>` : ''}${matPicker('x', used, {stock:true})}

  if(M.k === 'tras') return head('Solicitar traspaso', 'A una sucursal hermana. Su inventario no se ve desde aquí: confírmalo con ellos') + `<label class="ml">Sucursal</label><div class="seg2">${SUCS.map(s => `<button data-act="xsuc" data-v="${s}" aria-pressed="${M.suc === s}">${s}</button>`).join('')}</div>

    <label class="ml">Nota</label><input class="fld sm" data-in="xnote" value="${esc(M.note)}" placeholder="Para qué obra o por qué">` + foot('Enviar solicitud', 'xtraok', M.suc && M.lines.length, 'Queda como saldo por pagar al recibirlo');
  if(M.k === 'kar'){ const L = DB.moves.filter(x => x.m === M.m), s = DB.stock[M.m] || {q:0, min:0};

  if(M.k === 'rfq'){ const r = RQ(M.req);
    return head('Solicitud de cotización por correo', `R-${r.id}. Cada proveedor recibe solo lo que surte`, true) + M.sups.map(s => { const L = r.lines.filter(l => supHas(s, l.m)); return `<div class="mail"><p><b>Para:</b> ${esc(SUPS[s].n)} &lt;${SUPS[s].mail}&gt;</p><p><b>Asunto:</b> Solicitud de cotización R-${r.id}</p><p>Buen día, les pedimos cotización de:</p><ul>${L.map(l => `<li>${l.q} ${uq(l.q, MATS[l.m].u)} de ${MATS[l.m].n}</li>`).join('')}</ul><p>Entrega en ${r.dest === 'obra' ? esc(J(r.job).dir) : 'nuestro almacén de ' + SUC} a más tardar el ${fmtLong(r.need)}. Por favor indiquen precio unitario antes de IVA y tiempo de entrega.</p></div>`; }).join('') + foot(`Enviar ${M.sups.length} ${M.sups.length === 1 ? 'correo' : 'correos'}`, 'rfqok', true, 'Las respuestas se registran en el comparativo');

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const d = el.dataset, v = d.v, M = S.modal;
  const re = () => { renderAll(); };
  switch(d.act){
    case 'xpage': S.apage = v; renderAlmacen(); $('#main').scrollTo({top:0}); break;
    case 'rfq': { const r = RQ(S.reqId), sel = S.qsel || suggestSups(r).filter(s => !r.quotes.find(q => q.s === s)); S.modal = {k:'rfq', req:r.id, sups:sel}; renderLayer(); break; }
    case 'rfqok': { const r = RQ(M.req); doAskQuotes(r.id, M.sups); r.log[0].x = `Se enviaron ${M.sups.length} correos de solicitud de cotización: ${M.sups.map(s => SUPS[s].n).join(', ')}.`; S.qsel = null; S.addSup = false; S.modal = null; re(); toast(`${M.sups.length} ${M.sups.length === 1 ? 'correo enviado' : 'correos enviados'}. Registra las respuestas al llegar`); break; }
    case 'ivat': S.iva = v === '1'; renderOffice(); break;
    case 'salbud': { const j = J(S.jobId), {S:S_, R} = surtido(j), L = j.budget.mats.map(b => ({m:b.m, q:b.q - (S_[b.m] || 0) - (R[b.m] || 0)})).filter(l => l.q > 0); newSalReq(j.id, L, addWork(1), 'normal', 'Oficina'); re(); toast(`Solicitud enviada al almacén: ${L.length} materiales para ${j.n}`); break; }
    case 'gosal': setView('alm'); S.apage = 'sal'; renderAlmacen(); break;
    case 'dpage': if(S.view !== 'adm') setView('adm'); S.dpage = v; renderAdmin(); $('#main').scrollTo({top:0}); break;
    case 'xast': S.ast = v; S.apage = 'inv'; renderAlmacen(); break;
    case 'xkar': S.modal = {k:'kar', m:v}; renderLayer(); break;
    case 'xmost': S.modal = {k:'most', cli:null, cq:'', lines:[], dg:{t:'pct', v:0}, pago:'Efectivo', fac:false, rfc:'', mail:''}; S_MP.open.y = false; renderLayer(); break;
    case 'xbaja': S.modal = {k:'baja', lines:[], mot:null}; renderLayer(); break;
    case 'xtranew': S.modal = {k:'tras', lines:[], suc:SUCS[0], note:''}; renderLayer(); break;
    case 'xsal': { const s = DB.salidas.find(x => x.id === +v); S.modal = {k:'sal', job:s.job, sid:s.id, lines:s.lines.map(l => ({...l}))}; renderLayer(); break; }
    case 'xsalj': { const j = J(v), {S:S_, R} = surtido(j); S.modal = {k:'sal', job:j.id, lines:j.budget.mats.map(b => ({m:b.m, q:Math.max(0, b.q - (S_[b.m] || 0) - (R[b.m] || 0))})).filter(l => l.q).map(l => ({m:l.m, q:Math.min(l.q, Math.max(stk(l.m), 0)) || l.q}))}; renderLayer(); break; }
    case 'xq': { const l = M.lines[+d.i]; l.q = Math.max(1, l.q + +d.d); renderLayer(); break; }
    case 'xdel': M.lines.splice(+d.i, 1); renderLayer(); break;
    case 'xpago': M.pago = v; renderLayer(); break;
    case 'xfac': M.fac = v === 'Sí'; renderLayer(); break;
    case 'xmot': M.mot = v; renderLayer(); break;
    case 'xsuc': M.suc = v; renderLayer(); break;
    case 'xsalok': { const s = doSalida({job:M.job, sid:M.sid, lines:M.lines}); S.modal = null; const it = DB.items.find(i => i.sal === s.id); toCrew(it ? 'i' + it.id : 's' + s.id, it ? it.id : s.id, `Salió del almacén: ${reqLines(s, 2)} para ${J(s.job).n}`); re(); toast(`Salida registrada para ${J(s.job).n}. Inventario actualizado`); break; }
    case 'xbuyshort': { const L = M.lines.filter(l => stk(l.m) < l.q).map(l => ({m:l.m, q:l.q - Math.max(0, stk(l.m))})); S.modal = {k:'req', job:0, pickJob:false, lines:L, need:addWork(2), urg:'alta', note:`Faltante para ${J(M.job).n}`}; renderLayer(); break; }
    case 'xmostok': { const x = doVenta(M); S.modal = null; re(); toast(`Venta ${x.id} por ${money(x.total)}. Inventario actualizado${x.fac ? ', factura pendiente en Administración' : ''}`); break; }
    case 'xbajaok': { CLOCK += 1; M.lines.forEach(l => addMove(l.m, -l.q, 'baja', M.mot)); S.modal = null; re(); toast('Baja registrada'); break; }
    case 'xtraok': { const id = doTrasNew(M); S.modal = null; re(); toast(`${id} solicitado a ${M.suc}. Confírmalo con ellos`); break; }
    case 'xtra': { doTrasNext(v); re(); toast('Traspaso actualizado'); break; }
